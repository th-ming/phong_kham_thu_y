version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rexi_sqlserver
    environment:
      SA_PASSWORD: "${DB_PASSWORD:123456}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - rexi_network
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD:123456}", "-C", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # SQL Server Auto-Initialization
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rexi_sqlserver_init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./Database/PhongKhamThuY.sql:/init.sql:ro
    environment:
      SA_PASSWORD: "${DB_PASSWORD:123456}"
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Starting database initialization..."
        sleep 5
        /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "$$SA_PASSWORD" -C -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'PhongKhamThuY') CREATE DATABASE PhongKhamThuY;"
        /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "$$SA_PASSWORD" -C -d PhongKhamThuY -i /init.sql
        echo "Database initialization completed successfully!"
    networks:
      - rexi_network

  # Java Spring Boot Backend
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=PhongKhamThuY;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: "${DB_USERNAME:sa}"
      DB_PASSWORD: "${DB_PASSWORD:123456}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required and must be at least 32 characters}"
      JWT_EXPIRATION: "${JWT_EXPIRATION:86400000}"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      APP_FRONTEND_URL: "${APP_FRONTEND_URL:-http://localhost}"
      # Cấu hình Redis cho Caching khi chạy trên Docker
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
      VIETQR_BANK_ID: "${VIETQR_BANK_ID}"
      VIETQR_ACCOUNT_NO: "${VIETQR_ACCOUNT_NO}"
      VIETQR_ACCOUNT_NAME: "${VIETQR_ACCOUNT_NAME}"
      VNPAY_TMN_CODE: "${VNPAY_TMN_CODE}"
      VNPAY_HASH_SECRET: "${VNPAY_HASH_SECRET}"
      VNPAY_URL: "${VNPAY_URL}"
      VNPAY_RETURN_URL: "${VNPAY_RETURN_URL}"
    # ports:
    #   - "8081:8081" # BẢO MẬT: Ẩn port Backend, bắt buộc đi qua NGINX
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    volumes:
      - backend_logs:/app/logs
    networks:
      - rexi_network
    deploy:
      mode: replicated
      replicas: 1 # Bắt đầu với 1 container, có thể scale lên sau
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1.0'
          memory: 1500M
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/system/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        # Vite build tĩnh - biến PHẢI truyền vào lúc build qua args, không phải runtime environment
        # Khi chạy Docker nội bộ: dùng tên service 'backend'. Khi deploy lên server: dùng IP/Domain thật
        VITE_API_URL: "${VITE_API_URL:-http://backend:8081}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID}"
    # ports:
    #   - "3000:3000" # BẢO MẬT: Ẩn port Frontend, bắt buộc đi qua NGINX
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rexi_network
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for Caching
  redis:
    image: redis:alpine
    container_name: rexi_redis
    # BAO MAT: An port Redis, chi truy cap noi bo Docker network
    # ports:
    #   - "6379:6379"
    networks:
      - rexi_network
    restart: always
    volumes:
      - redis_data:/data
      
  # Lớp khiên NGINX (Reverse Proxy & Rate Limiter)
  nginx:
    image: nginx:alpine
    container_name: rexi_nginx
    ports:
      - "80:80"    # Mở cổng HTTP tiêu chuẩn 80 ra ngoài
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - rexi_network
    restart: always

volumes:
  sqlserver_data:
    driver: local
  backend_logs:
    driver: local
  redis_data:
    driver: local

networks:
  rexi_network:
    driver: bridge
