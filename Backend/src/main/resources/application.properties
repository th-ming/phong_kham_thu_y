# ============================================
# DEFAULT/LOCAL PROFILE - SQL Server
# ============================================
spring.config.activate.on-profile=local

server.port=${PORT:8081}

# C?U HINH N?N HTTP (GZIP) CHO M?NG Y?U
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

# C?U HINH ENCODING UTF-8 CHO TOAN B? H? TH?NG
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# C?U HINH DATABASE - K?t n?i SQL Server (B?n m?c d?nh ch?y Local)
spring.datasource.url=${DB_URL:jdbc:sqlserver://.\SQLEXPRESS;databaseName=PhongKhamThuY;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# C?u h?nh d? NGINX Proxy c? th? ho?t d?ng chung v?i requiresSecure()
server.forward-headers-strategy=native

# C?U HINH JPA (Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# C?U HINH LOGGING (Ghi nh?t ky h? th?ng)
logging.level.root=WARN
logging.level.com.rexi.pkty=INFO
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# C?U HINH CHIA KHOA AI (Groq & Gemini)
groq.api.key=${GROQ_API_KEY:}
groq.model=llama-3.3-70b-versatile
groq.vision.model=meta-llama/llama-4-scout-17b-16e-instruct

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.0-flash

openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model=deepseek/deepseek-chat-v3-0324:free

# C?U HINH CHIA KHOA JWT (Th? b?i dang nh?p)
jwt.secret=${JWT_SECRET:rexi_local_dev_secret_key_rexi_local_dev_secret_key_123}
jwt.expiration=${JWT_EXPIRATION:86400000}

# C?U HINH T?I FILE (H?nh ?nh th? cung, b?nh ?n)
server.tomcat.max-http-post-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# C?U HINH CORS (K?t n?i Frontend - Backend)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3001,http://localhost:3005,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:3001,http://127.0.0.1:3005}

# C?U HINH VIETQR
vietqr.bank.id=${VIETQR_BANK_ID:MB}
vietqr.account.no=${VIETQR_ACCOUNT_NO:***REMOVED***}
vietqr.account.name=${VIETQR_ACCOUNT_NAME:***REMOVED***}

# C?U HINH VNPAY
vnpay.tmn.code=${VNPAY_TMN_CODE:***REMOVED***-VNPAY_TMN_CODE}
vnpay.hash.secret=${VNPAY_HASH_SECRET:}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return.url=${VNPAY_RETURN_URL:http://localhost:5173/khach-hang/hoa-don-thanh-toan}
vnpay.ipn.url=${VNPAY_IPN_URL:http://localhost:8081/api/payment/vnpay/ipn}
webhook.secret=${WEBHOOK_SECRET:}

# THONG TIN ?NG D?NG
app.name=Rexi - H? th?ng qu?n ly ph?ng kh?m th? y
app.version=1.0.0
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3005}
# Cookie b?o m?t: false ? local dev (HTTP), d?i th?nh true khi deploy HTTPS production
app.cookie.secure=${COOKIE_SECURE:false}

# C?U HINH G?I EMAIL (Google SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:rexivetsys@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# C?U HINH PHAN QUY?N TAC V? AI (ACTION POLICY MAP)
ai.action.policy={'admin':{'CLICK','FILL','SELECT','TOGGLE','DELETE'},'quan_ly':{'CLICK','FILL','SELECT','TOGGLE'},'bac_si':{'CLICK','FILL','SELECT','TOGGLE'},'ke_toan':{'CLICK','FILL','SELECT','TOGGLE'},'tiep_tan':{'CLICK','FILL','SELECT','TOGGLE'},'y_ta':{'CLICK','FILL','SELECT','TOGGLE'},'staff':{'CLICK','FILL','SELECT'},'customer':{'CLICK','FILL','SELECT'},'khach_hang':{'CLICK','FILL','SELECT'},'guest':{'CLICK'}}
