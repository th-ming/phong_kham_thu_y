# ============================================
# PRODUCTION PROFILE - PostgreSQL / Supabase / Render
# ============================================
spring.config.activate.on-profile=prod

# DATABASE - Bat buoc dung PostgreSQL, KHONG dat default credential trong source
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# COOKIE BAO MAT - bat buoc true khi HTTPS production
app.cookie.secure=${COOKIE_SECURE:true}

# HIBERNATE DIALECT CHO POSTGRESQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect