# CẤU HÌNH DATABASE CHO MÔI TRƯỜNG CHẠY THỰC TẾ (PROD - PostgreSQL/Supabase)
# Không đặt default credential trong source code. Production bắt buộc truyền qua biến môi trường.
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.cookie.secure=${APP_COOKIE_SECURE:true}

# CẤU HÌNH HIBERNATE DIALECT CHO POSTGRESQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
